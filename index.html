<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050506">
<title>☉ Hello Friend — Console</title>
<script>
(function(){
  try{
    const saved = localStorage.getItem('theme');
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const dark = saved ? saved === 'dark' : sysDark;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-theme','dark');
  }
})();
</script>
<style>
:root{
  --bg:#f6f6f7;--fg:#111113;--dim:#5f5f66;--mute:#9a9aa1;
  --line:#e6e6ea;--line2:#d2d2d8;
  --green:#0f9d58;--red:#d93025;--orange:#c77d00;--blue:#1a73e8;
  --term-bg:#ffffff;--term-bar:#fafafa;
  --input-bg:#ffffff;--input-border:#d2d2d8;
  --shadow:0 20px 40px -20px rgba(0,0,0,.12);
}
[data-theme="dark"]{
  --bg:#050506;--fg:#ececf0;--dim:#9a9aa2;--mute:#4a4a52;
  --line:#181820;--line2:#27272f;
  --green:#46d68a;--red:#ff5a5a;--orange:#ffab3d;--blue:#7cc7ff;
  --term-bg:#08080a;--term-bar:#060608;
  --input-bg:#0b0b0f;--input-border:#27272f;
  --shadow:0 30px 80px -40px rgba(124,199,255,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  min-height:100dvh;color:var(--fg);
  font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"Courier New",monospace;
  font-size:clamp(12.5px,3.4vw,14.5px);line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  transition:background-color .35s ease,color .35s ease;
}
::selection{background:#10222f;color:var(--blue)}
.app{height:100dvh;display:flex;flex-direction:column;max-width:820px;margin:0 auto;
  padding:clamp(10px,2.5vw,20px);gap:clamp(8px,2vw,14px);position:relative}

/* === Унифицированный переключатель темы === */
.theme-toggle{
  position:absolute;
  top:calc(clamp(10px,2.5vw,20px) + env(safe-area-inset-top, 0px));
  right:calc(clamp(12px,4vw,24px) + env(safe-area-inset-right, 0px));
  width:40px;height:40px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--term-bar);
  border:1px solid var(--line2);
  color:var(--fg);
  border-radius:50%;
  font-size:1.05rem;line-height:1;
  cursor:pointer;
  z-index:100;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.theme-toggle:hover{background:var(--term-bg);border-color:var(--fg)}
.theme-toggle:active{transform:scale(.94)}
.theme-toggle:focus-visible{outline:2px solid var(--green);outline-offset:3px}

.head{display:flex;flex-direction:column;align-items:center;gap:4px;user-select:none;
  padding:2px 4px 4px;margin-top:10px}
.head .logo{font-size:clamp(40px,11vw,58px);font-weight:900;color:var(--fg);line-height:1;
  text-shadow:0 0 24px rgba(124,199,255,.12);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.78;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
.head h1{margin:2px 0 0;font-size:clamp(18px,5.8vw,26px);font-weight:900;
  letter-spacing:.28em;text-transform:uppercase;color:var(--fg)}
.head h1 span{color:var(--blue)}

.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--term-bar);font-size:.76em;user-select:none;
  transition:background-color .35s ease,border-color .35s ease}
.status .k{color:var(--mute);text-transform:uppercase;letter-spacing:.14em}
.status .v{color:var(--fg);font-weight:800}
.status .v.green{color:var(--green)}
.status .v.red{color:var(--red)}
.status .v.blue{color:var(--blue)}
.status .v.orange{color:var(--orange)}
.status .sep{color:var(--mute)}

.term{flex:1 1 auto;display:flex;flex-direction:column;
  border:1px solid var(--line2);border-radius:18px;
  background:radial-gradient(140% 60% at 50% 0%,rgba(124,199,255,.05),transparent 55%),var(--term-bg);
  overflow:hidden;box-shadow:var(--shadow);min-height:0;
  transition:background .35s ease,border-color .35s ease}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line);background:var(--term-bar);user-select:none;
  transition:background-color .35s ease,border-color .35s ease}
.dots{display:flex;gap:6px}
.dot{width:9px;height:9px;border-radius:50%}
.dot.a{background:#3a2020}.dot.b{background:#3a3520}.dot.c{background:#203a2a}
.bar .host{margin-left:auto;font-size:.72em;letter-spacing:.14em;color:var(--dim);
  text-transform:uppercase;font-weight:800}
.bar .host b{color:var(--red);font-weight:900}
.bar .host.local b{color:var(--green)}

.screen{flex:1 1 auto;overflow-y:auto;padding:clamp(12px,3vw,18px);
  font-size:.95em;line-height:1.6;scroll-behavior:smooth;overscroll-behavior:contain;min-height:0}
.screen::-webkit-scrollbar{width:7px}
.screen::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

.line{white-space:pre-wrap;word-break:break-word;margin:0 0 5px}
.line.cmd{color:var(--fg);font-weight:700}
.line.cmd::before{content:"$ ";color:var(--green);font-weight:900}
.line.dim{color:var(--dim)}
.line.err{color:var(--red)}
.line.warn{color:var(--orange)}
.line.ok{color:var(--green)}
.line.blue{color:var(--blue)}
.line.head{color:var(--fg);font-weight:900}
.line a{color:var(--blue);text-decoration:none;border-bottom:1px dotted var(--blue);word-break:break-all}
.loading{color:var(--mute);font-style:italic}
.loading::after{content:"";display:inline-block;width:.55em;height:.55em;margin-left:6px;
  border:1.5px solid var(--line2);border-top-color:var(--blue);border-radius:50%;
  animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}

.input-row{display:flex;align-items:center;gap:10px;border-top:2px solid var(--line2);
  background:var(--term-bar);padding:12px clamp(12px,3vw,16px);
  transition:background-color .35s ease,border-color .35s ease}
.ps1{color:var(--green);font-weight:900;user-select:none;font-size:1.05em;white-space:nowrap}
.ps1 .u{color:var(--blue)}.ps1 .h{color:var(--red)}.ps1 .h.local{color:var(--green)}
.ps1 .r{color:var(--orange)}
#input{flex:1 1 auto;min-height:44px;background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:10px;outline:0;color:var(--fg);font:inherit;font-weight:700;letter-spacing:.01em;
  padding:0 12px;caret-color:var(--green);
  transition:border-color .15s,box-shadow .15s,background-color .35s ease,color .35s ease}
#input:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(70,214,138,.15)}
#input::placeholder{color:var(--mute);font-weight:400}
#send{min-height:44px;min-width:48px;background:rgba(70,214,138,.08);
  border:1px solid var(--green);color:var(--green);border-radius:10px;
  font:inherit;font-weight:900;padding:0 14px;cursor:pointer;
  transition:background .15s,transform .1s}
#send:hover{background:rgba(70,214,138,.18)}
#send:active{transform:scale(.97)}
#send[disabled]{opacity:.35;cursor:default}

@media (max-width:380px){.head h1{letter-spacing:.2em}.ps1{font-size:.92em}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Переключить тему" aria-pressed="false">◐</button>

  <div class="head">
    <div class="logo">☉</div>
    <h1>HELLO <span>FRIEND</span></h1>
  </div>

  <div class="status">
    <span class="k">host</span><span class="v red" id="s-host">void</span>
    <span class="sep">·</span>
    <span class="k">user</span><span class="v blue" id="s-user">anon</span>
    <span class="sep">·</span>
    <span class="k">path</span><span class="v" id="s-path">/home/anon</span>
    <span class="sep">·</span>
    <span class="k">state</span><span class="v orange" id="s-state">recon</span>
  </div>

  <div class="term">
    <div class="bar">
      <div class="dots"><span class="dot a"></span><span class="dot b"></span><span class="dot c"></span></div>
      <span class="host" id="bar-host"><b>anon@void</b></span>
    </div>
    <div class="screen" id="screen" role="log" aria-live="polite"></div>
    <form class="input-row" id="form" autocomplete="off">
      <span class="ps1" id="ps1"><span class="u">anon</span>@<span class="h">void</span>:~$</span>
      <input id="input" name="cmd" type="text" inputmode="text" autocapitalize="off"
             autocorrect="off" spellcheck="false" enterkeyhint="send"
             placeholder="type a command…" aria-label="command">
      <button id="send" type="submit" aria-label="send">↵</button>
    </form>
  </div>
</div>

<script>
(() => {
"use strict";

// === Унифицированный переключатель темы ===
const themeToggle = document.getElementById('themeToggle');
const applyTheme = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  themeToggle.textContent = dark ? '◑' : '◐';
  themeToggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
  themeToggle.setAttribute('aria-label', dark ? 'Включить светлую тему' : 'Включить тёмную тему');
};
applyTheme();
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  applyTheme();
});

const $ = id => document.getElementById(id);
const screenEl = $("screen");
const input = $("input");
const form = $("form");
const sendBtn = $("send");
const ps1 = $("ps1");
const barHost = $("bar-host");
const sHost = $("s-host");
const sUser = $("s-user");
const sPath = $("s-path");
const sState = $("s-state");

const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const FS = {};
function mkdir(path, owner="anon", mode="755"){
  FS[path] = { type:"dir", content:[], owner, mode, mtime: Date.now() };
}
function write(path, content, owner="anon", mode="644", note){
  const parts = path.split("/").filter(Boolean);
  const name = parts.pop();
  const parent = "/" + parts.join("/");
  if (!FS[parent]) mkdir(parent);
  if (!FS[parent].content.includes(name)) FS[parent].content.push(name);
  FS[path] = { type:"file", content, owner, mode, mtime: Date.now(), note };
}

mkdir("/");
["bin","etc","home","var","var/log","var/mail","var/tmp","tmp","opt","opt/vault","srv","srv/http",
 "usr","usr/bin","usr/local","usr/local/bin","usr/share","usr/share/doc","root"].forEach(p => {
  const owner = p.startsWith("/root") || p.startsWith("/opt/vault") ? "root" : "anon";
  mkdir(p, owner, p === "/root" || p === "/opt/vault" ? "700" : "755");
});
mkdir("/home/anon","anon");
mkdir("/home/anon/.ssh","anon","700");
mkdir("/home/anon/.config","anon","700");

write("/etc/motd","☉ hello friend\n","root");
write("/etc/hostname","void\n","root");
write("/etc/os-release","NAME=\"void\"\nVERSION=\"1.0\"\nID=void\nPRETTY_NAME=\"void linux\"\n","root");
write("/etc/passwd",
  "root:x:0:0:root:/root:/bin/bash\n" +
  "anon:x:1000:1000::/home/anon:/bin/bash\n" +
  "sshd:x:104:65534::/run/sshd:/usr/sbin/nologin\n" +
  "www-data:x:33:33::/var/www:/usr/sbin/nologin\n","root");
write("/etc/hosts","127.0.0.1\tlocalhost\n127.0.1.1\tvoid\n::1\tlocalhost\n","root");
write("/etc/shadow",
  "root:$6$rounds=5000$saltroot$fakehash:19000:0:99999:7:::\n" +
  "anon:$6$rounds=5000$saltanon$fakehash:19000:0:99999:7:::\n","root","640");
write("/etc/crontab","# m h dom mon dow user  command\n*/5 * * * * root /usr/local/bin/trace >> /var/log/syslog 2>&1\n","root");
write("/etc/resolv.conf","nameserver 1.1.1.1\n","root");

write("/home/anon/notes.txt",
  "anon,\nесли ты снова здесь — значит, снова потерял.\n" +
  "я оставил след. он не в этой папке.\nсмотри в логи. смотри в motd.\nroot знает. anon — нет.\n","anon");
write("/home/anon/.bash_history",
  "ls -la\ncat notes.txt\ncd /var/log\ncat auth.log\ngrep fragment auth.log\n" +
  "cat /etc/motd\ncat /var/mail/anon\n" +
  "echo 'root pass hint: fr13nd?' >> /tmp/.h\n" +
  "cat /opt/vault/README\nsudo -i\n","anon");
write("/home/anon/.ssh/id_rsa",
  "-----BEGIN OPENSSH PRIVATE KEY-----\nAAAA...anon...AAAA\n-----END OPENSSH PRIVATE KEY-----\n","anon","600");
write("/home/anon/.config/user-dirs.dirs","XDG_DESKTOP_DIR=\"$HOME/Desktop\"\nXDG_DOWNLOAD_DIR=\"$HOME/Downloads\"\n","anon");

write("/var/log/syslog",
  "Nov  7 02:11:04 void kernel: [0.000000] boot\n" +
  "Nov  7 02:11:07 void systemd[1]: Started\n" +
  "Nov  7 02:14:22 void sshd[42]: Server listening on 0.0.0.0 port 22.\n" +
  "Nov  7 02:19:03 void sshd[128]: Accepted publickey for anon\n" +
  "Nov  7 02:19:47 void sh[128]: signal lost\n" +
  "Nov  7 02:22:00 void cron[87]: trace appended\n","root");
write("/var/log/auth.log",
  "Nov  7 02:19:03 void sshd[128]: Accepted publickey for anon from 127.0.0.1\n" +
  "Nov  7 02:19:03 void sshd[128]: pam_unix(sshd:session): session opened for user anon\n" +
  "Nov  7 02:21:14 void sshd[128]: Failed password for invalid user root\n" +
  "Nov  7 02:23:01 void sshd[128]: session closed\n" +
  "Nov  7 02:24:00 void su[200]: (to root) anon on pts/0\n" +
  "Nov  7 02:24:00 void su[200]: pam_unix(su:auth): authentication failure; logname=anon\n" +
  "# fragment: root pass -> 'fr' + '13' + 'nd' (see .bash_history)\n","root");
write("/var/log/dpkg.log",
  "2026-11-07 02:11:07 install base-files:amd64 1.0\n" +
  "2026-11-07 02:11:08 install bash:amd64 5.2\n" +
  "2026-11-07 02:11:10 install openssh-server:amd64 9.3\n","root");
write("/var/mail/anon",
  "From: unknown@friend.local\nTo: anon@void\nSubject: vault\n\n" +
  "contact is in /opt/vault/contact.\nroot owns it. you don't.\nask root. or become root.\n-- \n☉\n","anon");
write("/var/mail/spool/.w",
  "queued: 3 messages\nfrom: unknown@friend.local\nto: anon@void\nsubject: traces\n","anon");
write("/var/tmp/.trace",
  "02:19:03 anon opened notes.txt\n02:19:47 anon opened auth.log\n02:21:14 anon tried root\n","anon");

write("/opt/vault/README",
  "vault\n=====\ncontact: /opt/vault/contact\nowner:   root\nmode:    600\nread:    root only\n" +
  "root:    password is 6 chars. lowercase + digits. see logs.\n","root","644");
write("/opt/vault/contact",
  "059fd49bb600e6b62b0fe8e0370a7db2cea16620dbd41dfc720f6e3bed242a2055\n" +
  "type: SESSION\norigin: hello friend\npurpose: contact\nnote: this is not a token. it's a handshake.\n","root","600");

write("/srv/http/index.html","<h1>void</h1><p>nothing to see here.</p>\n","www-data");
write("/srv/http/robots.txt","User-agent: *\nDisallow: /backup/\nDisallow: /opt/\n","www-data");

write("/root/flag.txt","you became root. now you see.\n","root","600");
write("/root/.bash_history","cat /opt/vault/contact\nshred -u /root/.bash_history\n","root","600");

write("/tmp/.h","root pass hint: fr13nd?\n","anon");
write("/tmp/.s","last login: 02:19:03\nlast cmd:    cat /opt/vault/README\n","anon");
write("/tmp/.w","who: anon\nwhy: looking\n","anon");

["sh","bash","ls","cat","grep","find","sed","awk","cut","sort","uniq","wc","head","tail",
 "cp","mv","rm","mkdir","rmdir","touch","chmod","chown","ln","stat","file","du","df",
 "ps","top","ss","netstat","ping","curl","wget","ssh","scp","rsync","nc","tcpdump",
 "nano","vim","less","more","tar","gzip","base64","xxd","strings","openssl",
 "systemctl","journalctl","crontab","apt","dpkg","pip","git","whoami","id","uname","hostname",
 "date","uptime","free","who","last","sudo","su","clear","echo","env","history","man",
 "which","whereis","type","alias","export"].forEach(b => {
  write("/bin/" + b,"\x7fELF...\n","root","755");
});

const S = {
  host: "void",
  user: "anon",
  cwd: "/home/anon",
  history: [],
  histIdx: -1,
  env: {
    HOME: "/home/anon",
    USER: "anon",
    SHELL: "/bin/bash",
    TERM: "xterm-256color",
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
    LANG: "C.UTF-8"
  },
  aliases: {},
  sudoUntil: 0,
  sudoTries: 0,
  sudoLockedUntil: 0,
  proc: [
    {pid:1, cmd:"/sbin/init"},{pid:2, cmd:"[kthreadd]"},{pid:42, cmd:"/usr/sbin/sshd"},
    {pid:87, cmd:"/usr/bin/cron"},{pid:128, cmd:"/bin/bash"},{pid:200, cmd:"/usr/bin/nano notes.txt"}
  ],
  net: [
    {proto:"tcp", local:"0.0.0.0:22", state:"LISTEN", pid:42},
    {proto:"tcp", local:"127.0.0.1:631", state:"LISTEN", pid:87},
    {proto:"udp", local:"0.0.0.0:68", state:"ESTABLISHED", pid:1}
  ]
};
const ROOT_PASS = "fr13nd";
const SUDO_TIMEOUT = 3 * 60 * 1000;

function norm(p){
  if (!p) return S.cwd;
  if (p.startsWith("~")) p = S.env.HOME + p.slice(1);
  if (p.startsWith("/")) return p.replace(/\/+/g,"/").replace(/\/$/,"") || "/";
  const parts = (S.cwd + "/" + p).split("/");
  const out = [];
  for (const part of parts){
    if (!part || part === ".") continue;
    if (part === "..") out.pop();
    else out.push(part);
  }
  return "/" + out.join("/");
}
function baseOf(p){ const a = p.split("/").filter(Boolean); return a[a.length-1] || "/"; }
function parentOf(p){ const a = p.split("/").filter(Boolean); a.pop(); return "/" + a.join("/"); }
function isRoot(){ return S.user === "root" || Date.now() < S.sudoUntil; }
function canRead(path){
  const n = FS[path]; if (!n) return false;
  if ((n.mode === "600" || n.mode === "640") && n.owner === "root" && !isRoot()) return false;
  return true;
}
function canWrite(path){
  const n = FS[path]; if (!n) return false;
  if (n.owner === "root" && !isRoot()) return false;
  return true;
}

function pushLine(text, cls=""){
  const el = document.createElement("p");
  el.className = "line " + cls;
  el.textContent = text;
  screenEl.appendChild(el);
  screenEl.scrollTop = screenEl.scrollHeight;
  return el;
}
async function typeLine(text, cls="", speed=7){
  const el = pushLine("", cls);
  const chunk = Math.max(1, Math.ceil(text.length / 200));
  for (let i=0; i<text.length; i+=chunk){
    el.textContent += text.slice(i, i+chunk);
    screenEl.scrollTop = screenEl.scrollHeight;
    if (i % (chunk*4) === 0) await sleep(speed);
  }
  await sleep(15);
  return el;
}
async function typeLines(lines, cls=""){ for (const l of lines) await typeLine(l, cls, 5); }
async function withLoad(ms, fn){
  const el = pushLine("[ .... ]", "loading");
  await sleep(ms);
  el.remove();
  return fn();
}
function complexity(name, arg){
  const heavy = ["nmap","ssh","hydra","gobuster","wget","curl","tar","nc","find","grep","tree","systemctl","journalctl"];
  let ms = 90 + Math.random()*80;
  if (heavy.includes(name)) ms += 400 + Math.random()*500;
  if (arg && arg.length > 12) ms += arg.length * 6;
  return Math.min(2200, ms);
}

function updatePS1(){
  const home = S.env.HOME;
  const p = S.cwd === home ? "~" : S.cwd;
  const label = S.host;
  if (isRoot()){
    ps1.innerHTML = `<span class="r">root</span>@<span class="h">${esc(label)}</span>:${esc(p)}#`;
    barHost.innerHTML = `<b>root@${esc(label)}</b>`;
  } else {
    ps1.innerHTML = `<span class="u">${esc(S.user)}</span>@<span class="h">${esc(label)}</span>:${esc(p)}$`;
    barHost.innerHTML = `<b>${esc(S.user)}@${esc(label)}</b>`;
  }
  sHost.textContent = label;
  sUser.textContent = S.user;
  sUser.className = "v " + (isRoot() ? "orange" : "blue");
  sPath.textContent = p;
  sState.textContent = isRoot() ? "root" : "recon";
  sState.className = "v " + (isRoot() ? "orange" : "green");
}
updatePS1();

input.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp"){
    e.preventDefault();
    if (!S.history.length) return;
    S.histIdx = Math.max(0, S.histIdx - 1);
    input.value = S.history[S.histIdx] || "";
  } else if (e.key === "ArrowDown"){
    e.preventDefault();
    S.histIdx = Math.min(S.history.length, S.histIdx + 1);
    input.value = S.history[S.histIdx] || "";
  }
});

function askPassword(promptText){
  return new Promise(resolve => {
    const el = document.createElement("p");
    el.className = "line warn";
    el.textContent = promptText;
    screenEl.appendChild(el);
    screenEl.scrollTop = screenEl.scrollHeight;
    const inp = document.createElement("input");
    inp.type = "password";
    inp.autocomplete = "off";
    inp.style.cssText = "width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;color:var(--fg);font:inherit;font-weight:700;outline:0;padding:8px 10px;margin:4px 0 8px";
    screenEl.appendChild(inp);
    screenEl.scrollTop = screenEl.scrollHeight;
    inp.focus();
    const done = v => { inp.remove(); resolve(v); };
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter"){ e.preventDefault(); done(inp.value); }
      if (e.key === "Escape"){ done(""); }
    });
  });
}

CMD.ls = async (arg) => {
  const parts = (arg||"").split(/\s+/).filter(Boolean);
  const flags = parts.filter(x => x.startsWith("-")).join("");
  const targetArg = parts.find(x => !x.startsWith("-"));
  const path = norm(targetArg);
  const n = FS[path];
  if (!n){ await typeLine(`ls: cannot access '${targetArg||path}': No such file or directory`, "err"); return; }
  if (n.type === "file"){ await typeLine(baseOf(path)); return; }
  const showHidden = flags.includes("a");
  const long = flags.includes("l");
  const items = n.content.filter(x => showHidden || !x.startsWith(".")).sort();
  if (!items.length){ await typeLine(""); return; }
  if (long){
    const lines = items.map(name => {
      const full = path === "/" ? "/" + name : path + "/" + name;
      const c = FS[full];
      if (!c) return null;
      if (c.mode === "600" && c.owner === "root" && !isRoot())
        return `${"drwx------"} 1 root root   4096 ${name}${c.type==="dir"?"/":""}`;
      const isDir = c.type === "dir";
      const size = isDir ? 4096 : (c.content||"").length;
      const date = new Date(c.mtime);
      const p = n => String(n).padStart(2,"0");
      const dt = `${p(date.getMonth()+1)} ${p(date.getDate())} ${p(date.getHours())}:${p(date.getMinutes())}`;
      return `${isDir?"drwxr-xr-x":"-rw-r--r--"} 1 ${c.owner} ${c.owner} ${String(size).padStart(6)} ${dt} ${name}${isDir?"/":""}`;
    }).filter(Boolean);
    await typeLines(lines, "dim");
  } else {
    await typeLine(items.join("  "));
  }
};

CMD.tree = async (arg) => {

    if (depth > 6) return;
    const n = FS[p]; if (!n) return;
    if (n.mode === "600" && n.owner === "root" && !isRoot()) return;
    const name = p === "/" ? "/" : baseOf(p);
    lines.push("  ".repeat(depth) + name + (n.type === "dir" ? "/" : ""));
    if (n.type === "dir") n.content.slice().sort().forEach(c => walk(p === "/" ? "/" + c : p + "/" + c, depth + 1));
  };
  walk(root, 0);
  await typeLines(lines);
};

CMD.base64 = async (arg) => {

    try{ await typeLine(atob(n.content.replace(/\s+/g,"")), "ok"); }
    catch{ await typeLine("base64: invalid input", "err"); }
    return;
  }
  if (file){
    const n = FS[norm(file)];

CMD.xxd = async (arg) => {
  const name = (arg||"").trim();
  if (!name){ await typeLine("xxd: missing file", "err"); return; }
  const n = FS[norm(name)];
  if (!n || n.type === "dir"){ await typeLine(`xxd: ${name}: No such file`, "err"); return; }
  const bytes = new TextEncoder().encode(n.content);
  const lines = [];
  for (let i=0; i<Math.min(bytes.length, 256); i+=16){
    const chunk = bytes.slice(i, i+16);
    const hex = Array.from(chunk).map(b => b.toString(16).padStart(2,"0")).join(" ");
    const ascii = Array.from(chunk).map(b => (b>=32&&b<127)?String.fromCharCode(b):".").join("");
    lines.push(`${i.toString(16).padStart(8,"0")}: ${hex.padEnd(48)} ${ascii}`);
  }
  await typeLines(lines, "dim");
};

  if (FS[p]){ await typeLine(`mkdir: cannot create directory '${name}': File exists`, "err"); return; }
  mkdir(p, S.user);
  await typeLine(`created ${name}/`, "dim");
};
CMD.touch = async (arg) => {
  const name = (arg||"").trim();
  if (!name){ await typeLine("touch: missing operand", "err"); return; }
  const p = norm(name);
  if (FS[p]){ FS[p].mtime = Date.now(); return; }
  if (!canWrite(parentOf(p))){ await typeLine(`touch: ${name}: Permission denied`, "err"); return; }
  write(p, "", S.user);
  await typeLine(`created ${name}`, "dim");
};
CMD.rm = async (arg) => {
  const name = (arg||"").trim();
  if (!name){ await typeLine("rm: missing operand", "err"); return; }
  const p = norm(name);
  if (!FS[p]){ await typeLine(`rm: cannot remove '${name}': No such file`, "err"); return; }
  if (!canWrite(p)){ await typeLine(`rm: cannot remove '${name}': Permission denied`, "err"); return; }
  delete FS[p];
  const par = parentOf(p);
  if (FS[par] && FS[par].type === "dir") FS[par].content = FS[par].content.filter(x => x !== baseOf(p));
  await typeLine(`removed '${name}'`, "warn");
};
CMD.nano = async (arg) => {
  const name = (arg||"").trim();
  if (!name){ await typeLine("nano: no file", "err"); return; }
  const n = FS[norm(name)];
  if (!n || n.type === "dir"){ await typeLine(`nano: ${name}: No such file`, "err"); return; }
  await typeLine(`--- ${name} ---`, "dim");
  await typeLines(n.content.split("\n"));
  await typeLine(`--- EOF ---`, "dim");
};
CMD.vim = CMD.nano;
CMD.less = CMD.nano;
CMD.more = CMD.nano;

CMD.systemctl = async (arg) => {
  const s = (arg||"").trim();
  if (s === "status"){
    await typeLines(["* void","     State: running","     Jobs: 0 queued","   Failed: 0 units"], "dim");
  } else if (s === "list-units"){
    await typeLines([
      "UNIT              LOAD   ACTIVE SUB",
      "cron.service      loaded active running",
      "ssh.service       loaded active running",
      "systemd-journald  loaded active running"
    ], "dim");
  } else await typeLine("systemctl: missing command", "err");
};
CMD.journalctl = async () => {

    "-- Logs begin at Fri 2026-11-07 02:11:00 UTC --",
    "Nov 07 02:11:04 void kernel: boot",
    "Nov 07 02:14:22 void sshd[42]: listening on port 22",

  ], "dim");
};
CMD.crontab = async (arg) => {

  if (s === "-l"){
    await typeLines(["# m h dom mon dow user  command",
      "*/5 * * * * root /usr/local/bin/trace >> /var/log/syslog 2>&1",""], "dim");

};
CMD.apt = async (arg) => {
  const s = (arg||"").trim();
  if (s.startsWith("list")){
    await typeLines(["base-files/stable 1.0 amd64","bash/stable 5.2 amd64",
      "openssh-server/stable 9.3 amd64","nano/stable 7.2 amd64"], "dim");
  } else if (s.startsWith("install")){
    await typeLine("apt: install requires root", "err");

};
CMD.dpkg = async (arg) => {
  const s = (arg||"").trim();
  if (s === "-l"){
    await typeLines([
      "ii  base-files   1.0   amd64  base system",
      "ii  bash         5.2   amd64  GNU Bourne shell",
      "ii  openssh      9.3   amd64  SSH client/server",
      "ii  nano         7.2   amd64  text editor"
    ], "dim");
  } else await typeLine("dpkg: usage: dpkg -l", "err");
};
CMD.pip = async (arg) => {
  const s = (arg||"").trim();
  if (s === "list"){
    await typeLines(["Package    Version","---------- -------","pip        23.3","setuptools 68.0"], "dim");
  } else await typeLine("pip: usage: pip list", "err");
};
CMD.git = async (arg) => {
  const s = (arg||"").trim();
  if (s === "log"){
    await typeLines([
      "commit 3f2a1b0 (HEAD -> main)","Author: unknown <unknown@friend.local>",
      "Date:   Fri Nov 7 02:14:00 2026","","    initial commit"
    ], "dim");
  } else await typeLine("git: unknown command", "err");
};
CMD.sudo = async (arg) => {
  if (!arg){ await typeLine("usage: sudo <command>", "err"); return; }
  if (isRoot()){ await runInternal(arg); return; }
  if (Date.now() < S.sudoLockedUntil){
    await typeLine(`sudo: locked for ${Math.ceil((S.sudoLockedUntil-Date.now())/1000)}s`, "err");
    return;
  }
  const pass = await askPassword(`[sudo] password for ${S.user}: `);
  if (pass === ROOT_PASS){
    S.sudoUntil = Date.now() + SUDO_TIMEOUT;
    S.sudoTries = 0;
    updatePS1();
    await typeLine("sudo: authenticated", "ok");
    await runInternal(arg);
  } else {
    S.sudoTries++;
    if (S.sudoTries >= 3){
      S.sudoLockedUntil = Date.now() + 30000;
      S.sudoTries = 0;
      await typeLine("sudo: 3 incorrect password attempts", "err");
    } else await typeLine("Sorry, try again.", "warn");
  }
};
CMD.su = async (arg) => {
  const user = (arg||"root").trim();
  const pass = await askPassword(`Password: `);
  if (user === "root" && pass === ROOT_PASS){
    S.user = "root";
    S.sudoUntil = Date.now() + SUDO_TIMEOUT;
    updatePS1();
    await typeLine("root@void:~#", "ok");
  } else {
    await typeLine("su: Authentication failure", "err");
  }
};
CMD.history = async () => {
  if (!S.history.length){ await typeLine("(empty)", "dim"); return; }
  await typeLines(S.history.map((h,i) => `  ${String(i+1).padStart(4)}  ${h}`), "dim");
};
CMD.exit = async () => { await typeLine("logout", "dim"); await typeLine("session closed.", "warn"); };

async function runInternal(line){
  const parts = line.split("|").map(x => x.trim()).filter(Boolean);
  if (parts.length > 1){
    const first = parts[0], second = parts[1];
    const ft = first.split(/\s+/), st = second.split(/\s+/);
    const fname = ft[0].toLowerCase(), sname = st[0].toLowerCase();
    if (fname === "cat" && sname === "base64" && st[1] === "-d"){
      const n = FS[norm(ft[1]||"")];
      if (!n){ await typeLine(`cat: ${ft[1]}: No such file`, "err"); return; }
      try{ await typeLine(atob(n.content.replace(/\s+/g,"")), "ok"); }
      catch{ await typeLine("base64: invalid input", "err"); }
      return;
    }
    if (fname === "cat" && sname === "grep" && st[1]){
      const n = FS[norm(ft[1]||"")];
      if (!n){ await typeLine(`cat: ${ft[1]}: No such file`, "err"); return; }
      const lines = n.content.split("\n").filter(l => l.includes(st[1]));
      await typeLines(lines.length ? lines : ["(no matches)"], "ok");
      return;
    }
    await typeLine("pipe: unsupported", "err");
    return;
  }

  const tokens = line.split(/\s+/);
  let name = tokens[0];
  let arg = tokens.slice(1).join(" ");

  if (S.aliases[name]){
    const expanded = S.aliases[name] + (arg ? " " + arg : "");
    const t2 = expanded.split(/\s+/);
    name = t2[0];
    arg = t2.slice(1).join(" ");
  }

  const lname = name.toLowerCase();
  if (!CMD[lname]){ await typeLine(`${name}: command not found`, "err"); return; }

  sendBtn.disabled = true;
  try{
    await withLoad(complexity(lname, arg), () => CMD[lname](arg));
  }catch(e){
    await typeLine("shell: internal error", "err");
  }finally{
    sendBtn.disabled = false;
    updatePS1();
  }
}

async function run(raw){
  const line = raw.trim();
  if (!line) return;
  S.history.push(line);
  S.histIdx = S.history.length;
  const cmdEl = pushLine("", "cmd");
  cmdEl.textContent = line;
  await runInternal(line);
}

let submitting = false;
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (submitting) return;
  submitting = true;
  const v = input.value;
  input.value = "";
  await run(v);
  input.focus();
  submitting = false;
});

if (window.matchMedia("(hover:hover) and (pointer:fine)").matches){
  input.focus();
}

(async () => {
  await typeLines(["void login: anon (automatic)","",...FS["/etc/motd"].content.split("\n")], "dim");
})();

})();
